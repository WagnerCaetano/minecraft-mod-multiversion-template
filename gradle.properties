org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Shared mod metadata (used by forge + neoforge subprojects)
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Multi-version mod template (Forge 1.20.1 + NeoForge 1.21.1).

# CurseForge: mod page → About → Project ID (numeric). Leave empty to skip publish tasks locally.
curseforge_project_id=
# alpha | beta | release
curseforge_release_type=release
